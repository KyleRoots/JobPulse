name: Tests

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v4

    - name: Refuse a checked-in environment file
      run: |
        if [ -f .env ] || [ -f .env.local ]; then
          echo "Refusing to run tests with an environment file in the checkout."
          exit 1
        fi
    
    - name: Set up Python 3.11
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
        cache: 'pip'
    
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
    
    - name: Run tests
      env:
        APP_ENV: testing
        FLASK_ENV: testing
        TESTING: 'true'
      run: |
        pytest tests/ -v --tb=short
